<!DOCTYPE html> <!-- говорим браузеру: это HTML-страница -->
<html lang="en"> <!-- начало страницы -->
  <head> <!-- служебная часть страницы (её не видно) -->
    <meta charset="UTF-8" /> <!-- кодировка, чтобы русские буквы показывались правильно -->
    <title>Экзамен React</title> <!-- название вкладки браузера -->
  </head> <!-- конец служебной части -->
  <body> <!-- то, что видно на странице -->
    <!-- Вот этот div - единственная зацепка для React. -->
    <!-- ВСЁ приложение будет построено ВНУТРИ этого элемента. -->
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script> <!-- подключаем наш код: точку входа index.jsx -->
  </body> <!-- конец видимой части -->
</html> <!-- конец страницы -->
